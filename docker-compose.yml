version: '3.8'

services:
  dashboard:
    build: .
    container_name: safeassets-dashboard
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
